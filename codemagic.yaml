# إعداد بناء سحابي لـ Codemagic — يبني Android و iOS بدون الحاجة لجهاز Mac محلي.
# ارفع المشروع إلى GitHub/GitLab ثم اربطه في codemagic.io.
# املأ المتغيرات الحساسة في Codemagic UI كـ Environment variables (مجموعة "tint").
workflows:
  android-workflow:
    name: Tint Android (AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - tint            # عرّف فيها: TINT_API_BASE_URL, TINT_TABBY_PUBLIC_KEY, TINT_TABBY_MERCHANT_CODE
      android_signing:
        - tint_keystore   # ارفع keystore في Codemagic > Code signing identities
    scripts:
      # ‼️ **لا `flutter create` بعد اليوم — والمشروع مُودَعٌ في المستودع.**
      #
      # كان يُولّد `ios/Runner.xcodeproj` في كلّ بناء لأنّه لم يكن مُتعقّباً،
      # فيُمحى معه **كلّ ما يُكتب في المشروع**: الصلاحيّات (آبل باي)، وربط
      # ملفّات التوقيع، وأيّ قدرةٍ تُضاف مستقبلاً. ولذلك وُجد `sed` أدناه
      # لإصلاح معرّف الحزمة بعد كلّ توليد.
      #
      # وحارسٌ يتحقّق بدل توليدٍ يمحو: غيابُ المشروع خطأ يُوقف البناء ولا
      # يُصلَح صامتاً بنسخةٍ افتراضيّة تُنتج تطبيقاً بلا صلاحيّات.
      - name: Verify platform projects exist
        script: |
          set -e
          test -f ios/Runner.xcodeproj/project.pbxproj || {
            echo "✗ ios/Runner.xcodeproj غير موجود — لا يُولَّد هنا، يُودَع في المستودع."; exit 1; }
          test -d android || { echo "✗ مجلّد android مفقود."; exit 1; }
      # ‼️ **معرّف الحزمة مثبَّتٌ في المشروع المُودَع** — لا يُصلَح بـ`sed` هنا.
      #
      # كان يُولَّد في كلّ بناء من اسم المشروع (`tint_mobile`) فيخرج
      # `com.tintstore.tintMobile` مخالفاً لأندرويد، فيُصحَّح بعد كلّ توليد.
      # ومذ صار المشروع مُودَعاً صار `com.tintstore.app` مكتوباً فيه —
      # **والمعرّف لا يتغيّر بعد النشر أبداً**، فتثبيته أصدق من إصلاحه.
      - name: Get packages
        script: flutter pub get
      - name: Generate icons & splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Guard — API base must not be empty
        script: |
          # ‼️ **يسقط البناء بدل أن يرفع تطبيقاً لا يصل خادمه.**
          #    متغيّرٌ فارغ يُمرَّر كـ`--dart-define=K=` فيُبطل الافتراضيّ في
          #    الشيفرة، ويُنتج حزمةً تُقلع وتبدو سليمة ولا تجلب شيئاً.
          if [ -z "$TINT_API_BASE_URL" ]; then
            echo "‼️ TINT_API_BASE_URL فارغ — راجع مجموعة المتغيّرات tint."
            exit 1
          fi
          echo "قاعدة الـAPI: $TINT_API_BASE_URL"
      # ‼️ **خرائط جوجل تُشغَّل بوجود مفتاحها لا بقرارٍ منفصل.**
      #
      #    عَلَمٌ يُرفع بلا مفتاح يُنتج **خريطةً رماديّة صامتة** في شاشة العنوان،
      #    وهي أسوأ من خريطةٍ مجّانيّة تعمل. فالمتغيّر الواحد يقود الاثنين:
      #    وُجد المفتاح ⇒ حُقن ورُفع العَلَم؛ غاب ⇒ تبقى بلاطات CartoDB.
      #
      #    ‼️ ومفتاح أندرويد **مقيَّدٌ باسم الحزمة وبصمة التوقيع**، ومفتاح iOS
      #    بمعرّف الحزمة — فلا يُخلَطان، ولا يُستعمل مفتاح الخادم (ترميز
      #    العناوين) في أيّهما: قيوده متعارضة، وتوحيدها يُلغي حماية أحدهما.
      - name: Maps key (optional)
        script: |
          MAPS_FLAG=""
          if [ -n "$TINT_MAPS_ANDROID_KEY" ] || [ -n "$TINT_MAPS_IOS_KEY" ]; then
            MAPS_FLAG="--dart-define=TINT_GOOGLE_MAPS=true"
            echo "خرائط جوجل: مُفعّلة"
          else
            echo "خرائط جوجل: مُعطّلة (لا مفتاح) — تُستعمل بلاطات CartoDB"
          fi
          echo "MAPS_FLAG=$MAPS_FLAG" >> $CM_ENV
          if [ -n "$TINT_MAPS_IOS_KEY" ] && [ -f ios/Runner/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :MAPS_API_KEY $TINT_MAPS_IOS_KEY" ios/Runner/Info.plist 2>/dev/null               || /usr/libexec/PlistBuddy -c "Add :MAPS_API_KEY string $TINT_MAPS_IOS_KEY" ios/Runner/Info.plist
            echo "مفتاح خرائط iOS حُقن في Info.plist"
          fi
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --dart-define=TINT_API_BASE_URL=$TINT_API_BASE_URL \
            --dart-define=TINT_TABBY_PUBLIC_KEY=$TINT_TABBY_PUBLIC_KEY \
            --dart-define=TINT_TABBY_MERCHANT_CODE=$TINT_TABBY_MERCHANT_CODE \
            --dart-define=TINT_TABBY_LANG=ar \
            $MAPS_FLAG
      # ‼️ **وAPK بجوار الـAAB — لأنّ الـAAB لا يُثبَّت على هاتف.**
      #
      #    الحزمة (`.aab`) صيغةٌ يفكّها متجر Play ليُولّد منها نسخةً لكلّ جهاز،
      #    وأندرويد لا يقبلها مباشرةً. فتجربة نسخة النشر على جهازٍ حقيقيّ — قبل
      #    الرفع، أو بلا رفعٍ أصلاً — كانت متعذّرة.
      #
      #    وهي **موقَّعةٌ بمفتاح النشر نفسه**، فما يُختبَر هو ما يُنشَر: نفس
      #    التصغير، ونفس البصمة التي تُقيَّد بها مفاتيح جوجل.
      - name: Build APK (للتجربة على جهاز)
        script: |
          flutter build apk --release \
            --dart-define=TINT_API_BASE_URL=$TINT_API_BASE_URL \
            --dart-define=TINT_TABBY_PUBLIC_KEY=$TINT_TABBY_PUBLIC_KEY \
            --dart-define=TINT_TABBY_MERCHANT_CODE=$TINT_TABBY_MERCHANT_CODE \
            --dart-define=TINT_TABBY_LANG=ar \
            $MAPS_FLAG
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/apk/**/*.apk

  ios-workflow:
    name: Tint iOS (IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # ‼️ **المفتاح يُسمّى صراحةً — و`auth: integration` وحدها لا تكفي.**
    #
    # ‼️ والاسم `Tint` هو **ما كُتب في Codemagic** عند ربط مفتاح
    #   App Store Connect (Settings ← Integrations ← Developer Portal) — لا اسم
    #   التطبيق ولا المتجر. وتغييرُه هناك يكسر البناء هنا بلا أثرٍ في المستودع.
    integrations:
      app_store_connect: Tint
    environment:
      flutter: stable
      groups:
        - tint
      # ‼️ **`ios_signing` أُزيلت عمداً — وهي التي أسقطت أوّل بناءٍ موقّع.**
      #
      # كتلة `ios_signing` تُشغّل توقيعاً تلقائيّاً يعمل **قبل** أيّ سكربت،
      # وهو **يبحث عن بروفايل ولا يُنشئه**. وحسابنا بلا شهادة توزيع (صفر
      # شهادات — قِيس 2026-08-15)، والبروفايل لا يُنشأ بلا شهادة يشير إليها.
      # فسقط البناء فوراً بـ«No matching profiles found».
      #
      # والبديل أدناه صريح: يُنشئ الشهادة والبروفايل إن غابا (`--create`).
    scripts:
      # ‼️ **لا `flutter create` بعد اليوم — والمشروع مُودَعٌ في المستودع.**
      #
      # كان يُولّد `ios/Runner.xcodeproj` في كلّ بناء لأنّه لم يكن مُتعقّباً،
      # فيُمحى معه **كلّ ما يُكتب في المشروع**: الصلاحيّات (آبل باي)، وربط
      # ملفّات التوقيع، وأيّ قدرةٍ تُضاف مستقبلاً. ولذلك وُجد `sed` أدناه
      # لإصلاح معرّف الحزمة بعد كلّ توليد.
      #
      # وحارسٌ يتحقّق بدل توليدٍ يمحو: غيابُ المشروع خطأ يُوقف البناء ولا
      # يُصلَح صامتاً بنسخةٍ افتراضيّة تُنتج تطبيقاً بلا صلاحيّات.
      - name: Verify platform projects exist
        script: |
          set -e
          test -f ios/Runner.xcodeproj/project.pbxproj || {
            echo "✗ ios/Runner.xcodeproj غير موجود — لا يُولَّد هنا، يُودَع في المستودع."; exit 1; }
          test -d android || { echo "✗ مجلّد android مفقود."; exit 1; }
      # ‼️ **معرّف الحزمة مثبَّتٌ في المشروع المُودَع** — لا يُصلَح بـ`sed` هنا.
      #
      # كان يُولَّد في كلّ بناء من اسم المشروع (`tint_mobile`) فيخرج
      # `com.tintstore.tintMobile` مخالفاً لأندرويد، فيُصحَّح بعد كلّ توليد.
      # ومذ صار المشروع مُودَعاً صار `com.tintstore.app` مكتوباً فيه —
      # **والمعرّف لا يتغيّر بعد النشر أبداً**، فتثبيته أصدق من إصلاحه.
      - name: Get packages
        script: flutter pub get
      - name: Generate icons & splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      # التوقيع — إنشاءٌ صريح لا بحثٌ صامت.
      #
      # ‼️ **الترتيب مُلزِم**، وكلّ خطوةٍ تعتمد على التي قبلها:
      #  ١· `keychain initialize` — سلسلة مفاتيح مؤقّتة لهذا البناء وحده.
      #  ٢· `fetch-signing-files --create` — تُنشئ الشهادة والبروفايل إن غابا.
      #
      # ‼️ **و`--certificate-key` ليست تحسيناً بل شرط تكرار.**
      #
      # الشهادة عند أبل نصفُ الحكاية؛ نصفها الآخر مفتاحٌ خاصّ يبقى على الآلة
      # التي أنشأتها. وآلة البناء تُدمَّر بعد كلّ بناء — فبلا مفتاحٍ ثابت تُنشئ
      # كلّ مرّةٍ شهادةً جديدة حتّى تمتلئ حصّة الثلاث، ثمّ **تُلغي شهادةً قائمة**
      # قد تكون لمتجرٍ آخر في الفريق نفسه.
      #
      # ورُصد حرفيّاً (2026-08-15): بناءٌ أنشأ شهادةً ومات بمفتاحها، فسقط الذي
      # بعده بـ«Cannot save Signing Certificates without certificate private
      # key» — الشهادة عند أبل ولا أحد يملك مفتاحها.
      #
      # فيُولَّد المفتاح **مرّةً واحدة** ويُحفظ سرّاً في `CERTIFICATE_PRIVATE_KEY_B64`،
      # فتُعاد الشهادة نفسها في كلّ بناء.
      #  ٣· `add-certificates` — تُدخل الشهادة في السلسلة ليجدها Xcode.
      #  ٤· `use-profiles` — تكتب إعدادات التوقيع في مشروع Xcode **وتُولّد
      #     `export_options.plist`** الذي يطلبه `flutter build ipa` أدناه.
      #
      # ‼️ ولا يُنشئ شهادةً ثانية إن وُجدت صالحة — فلا خطر على حدّ الثلاث ولا
      #    على شهادات المتاجر الأخرى.
      - name: Set up code signing — create certificate and profile if missing
        script: |
          set -e
          keychain initialize
          # ‼️ **المفتاح يُخزَّن مُرمَّزاً بـbase64 ويُفكّ هنا — لا يُمرَّر نصّاً.**
          #
          # `--certificate-key=@env:` يقرأ المتغيّر كما هو، ومفتاح PEM نصٌّ متعدّد
          # الأسطر. وحقلُ المتغيّرات في Codemagic طوى الأسطر فوصل سطراً واحداً —
          # ومفتاحٌ بلا أسطره ليس مفتاحاً:
          #   «Provided value in environment variable ... is not valid»
          #
          # وbase64 سطرٌ واحد بطبعه، فيعبر أيّ حقلٍ بلا تشويه.
          printf %s "$CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -d -A > /tmp/ios_cert_key.pem
          # يُتحقَّق منه قبل الاستعمال: خطأٌ هنا يقول «المفتاح تالف» صراحةً، بدل أن
          # يظهر لاحقاً كفشل توقيعٍ غامض.
          openssl rsa -in /tmp/ios_cert_key.pem -noout -check
          app-store-connect fetch-signing-files "com.tintstore.app" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/ios_cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Guard — API base must not be empty
        script: |
          # ‼️ **يسقط البناء بدل أن يرفع تطبيقاً لا يصل خادمه.**
          #    متغيّرٌ فارغ يُمرَّر كـ`--dart-define=K=` فيُبطل الافتراضيّ في
          #    الشيفرة، ويُنتج حزمةً تُقلع وتبدو سليمة ولا تجلب شيئاً.
          if [ -z "$TINT_API_BASE_URL" ]; then
            echo "‼️ TINT_API_BASE_URL فارغ — راجع مجموعة المتغيّرات tint."
            exit 1
          fi
          echo "قاعدة الـAPI: $TINT_API_BASE_URL"
      # ‼️ **خرائط جوجل تُشغَّل بوجود مفتاحها لا بقرارٍ منفصل.**
      #
      #    عَلَمٌ يُرفع بلا مفتاح يُنتج **خريطةً رماديّة صامتة** في شاشة العنوان،
      #    وهي أسوأ من خريطةٍ مجّانيّة تعمل. فالمتغيّر الواحد يقود الاثنين:
      #    وُجد المفتاح ⇒ حُقن ورُفع العَلَم؛ غاب ⇒ تبقى بلاطات CartoDB.
      #
      #    ‼️ ومفتاح أندرويد **مقيَّدٌ باسم الحزمة وبصمة التوقيع**، ومفتاح iOS
      #    بمعرّف الحزمة — فلا يُخلَطان، ولا يُستعمل مفتاح الخادم (ترميز
      #    العناوين) في أيّهما: قيوده متعارضة، وتوحيدها يُلغي حماية أحدهما.
      - name: Maps key (optional)
        script: |
          MAPS_FLAG=""
          if [ -n "$TINT_MAPS_ANDROID_KEY" ] || [ -n "$TINT_MAPS_IOS_KEY" ]; then
            MAPS_FLAG="--dart-define=TINT_GOOGLE_MAPS=true"
            echo "خرائط جوجل: مُفعّلة"
          else
            echo "خرائط جوجل: مُعطّلة (لا مفتاح) — تُستعمل بلاطات CartoDB"
          fi
          echo "MAPS_FLAG=$MAPS_FLAG" >> $CM_ENV
          if [ -n "$TINT_MAPS_IOS_KEY" ] && [ -f ios/Runner/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :MAPS_API_KEY $TINT_MAPS_IOS_KEY" ios/Runner/Info.plist 2>/dev/null               || /usr/libexec/PlistBuddy -c "Add :MAPS_API_KEY string $TINT_MAPS_IOS_KEY" ios/Runner/Info.plist
            echo "مفتاح خرائط iOS حُقن في Info.plist"
          fi
      - name: Build IPA
        script: |
          # !! **العودة إلى `flutter build ipa` — والالتفاف السابق كان علاج عَرَض.**
          #
          # فشل هذا الأمر أوّلاً بـ«No development certificates available»، فظُنّ
          # أنّه يرفض شهادة التوزيع. والسبب الحقيقيّ أنّ معرّف الحزمة كان
          # `com.tintstore.tintMobile` فلم تجد `use-profiles` بروفايلاً يطابقه،
          # فبقي التوقيع **تلقائيّاً** — وعندها يبحث Flutter عن هويّة تطوير.
          #
          # ومع المعرّف الصحيح يصير التوقيع **يدويّاً** ببروفايلٍ مُعيَّن، فلا
          # يبحث Flutter عن شيء. و`use-profiles` تُولّد `export_options.plist`.
          flutter build ipa --release \
            --dart-define=TINT_API_BASE_URL=$TINT_API_BASE_URL \
            --dart-define=TINT_TABBY_PUBLIC_KEY=$TINT_TABBY_PUBLIC_KEY \
            --dart-define=TINT_TABBY_MERCHANT_CODE=$TINT_TABBY_MERCHANT_CODE \
            --dart-define=TINT_TABBY_LANG=ar \
            $MAPS_FLAG \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      # ‼️ **إلى TestFlight فقط — والنشر في المتجر مُطفأٌ صراحةً.**
      #
      # `submit_to_app_store: false` مكتوبةٌ ولو كانت الافتراضيّ: سطرٌ صريح
      # يمنع أن يُقلبها أحدٌ سهواً، والفرق بين الحالتين أنّ الثانية تعرض
      # التطبيق على العالم بلا رجعة.
      #
      # والاختبار **الداخليّ** بلا مراجعةٍ إطلاقاً: البناء يصل المختبرين خلال
      # دقائق. أمّا الخارجيّ فيلزمه فحص أبل المختصر — ولا يبدأ إلّا بطلبك.
      app_store_connect:
        auth: integration
        # !! **مُطفأة: هذه تُقدّم النسخة لمراجعة أبل للاختبار *الخارجيّ*.**
        #
        # والاختبار **الداخليّ** لا يحتاجها إطلاقاً — الرفع وحده يُتيح النسخة
        # للمختبرين الداخليّين خلال دقائق بلا مراجعة.
        #
        # ورُصد (2026-08-16): البناء نجح ورُفعت النسخة وعُولجت، ثمّ سقط
        # `post-processing` عند هذه الخطوة لنقص «Beta App Review Information»
        # (اسم · هاتف · بريد). فيبدو البناء فاشلاً وهو ناجح.
        #
        # تُعاد إلى `true` يوم تُدعى مختبرون من خارج الفريق، بعد ملء المعلومات
        # في App Store Connect ← TestFlight ← Test Information.
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - asd.ss1993nawaf@gmail.com
        notify:
          success: true
          failure: true

  # ────────────────────────────────────────────────────────────────────────
  # معاينة iOS على المحاكي — **بلا حساب مطوّر أبل وبلا توقيع**.
  #
  # ‼️ Xcode ومحاكيه مجّانيّان؛ اشتراك أبل ($99) يلزم للتوقيع والنشر على جهازٍ
  # حقيقيّ فقط. فهذا المسار يُري الشكل الفعليّ على iOS بلا أيّ إنفاق.
  #
  # ‼️ وحدوده صريحة: **لقطاتٌ لا جلسة تفاعليّة** — تنظر ولا تلمس. والدفع
  # الحقيقيّ وApple Pay والكاميرا لا تعمل على محاكٍ أصلاً.
  # ────────────────────────────────────────────────────────────────────────
  ios-preview:
    name: Tint iOS (معاينة محاكي — بلا توقيع)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      groups:
        - tint
    scripts:
      # ‼️ **لا `flutter create` بعد اليوم — والمشروع مُودَعٌ في المستودع.**
      #
      # كان يُولّد `ios/Runner.xcodeproj` في كلّ بناء لأنّه لم يكن مُتعقّباً،
      # فيُمحى معه **كلّ ما يُكتب في المشروع**: الصلاحيّات (آبل باي)، وربط
      # ملفّات التوقيع، وأيّ قدرةٍ تُضاف مستقبلاً. ولذلك وُجد `sed` أدناه
      # لإصلاح معرّف الحزمة بعد كلّ توليد.
      #
      # وحارسٌ يتحقّق بدل توليدٍ يمحو: غيابُ المشروع خطأ يُوقف البناء ولا
      # يُصلَح صامتاً بنسخةٍ افتراضيّة تُنتج تطبيقاً بلا صلاحيّات.
      - name: Verify platform projects exist
        script: |
          set -e
          test -f ios/Runner.xcodeproj/project.pbxproj || {
            echo "✗ ios/Runner.xcodeproj غير موجود — لا يُولَّد هنا، يُودَع في المستودع."; exit 1; }
          test -d android || { echo "✗ مجلّد android مفقود."; exit 1; }
      # ‼️ **معرّف الحزمة مثبَّتٌ في المشروع المُودَع** — لا يُصلَح بـ`sed` هنا.
      #
      # كان يُولَّد في كلّ بناء من اسم المشروع (`tint_mobile`) فيخرج
      # `com.tintstore.tintMobile` مخالفاً لأندرويد، فيُصحَّح بعد كلّ توليد.
      # ومذ صار المشروع مُودَعاً صار `com.tintstore.app` مكتوباً فيه —
      # **والمعرّف لا يتغيّر بعد النشر أبداً**، فتثبيته أصدق من إصلاحه.
      - name: Get packages
        script: flutter pub get
      - name: Generate icons & splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      # ‼️ `--simulator` يبني لمعماريّة المحاكي، و`--no-codesign` يتخطّى التوقيع
      #    كلّه — وهو ما يجعل هذا المسار ممكناً بلا حساب أبل.
      # ‼️ تشخيصٌ يفصل «المتغيّر فارغ» عن «الشبكة محجوبة» — وهما يُنتجان نفس
      #    العَرَض: تطبيقٌ يُقلع بأرففٍ فارغة و`statusCode: null`.
      - name: Verify API endpoint before building
        script: |
          echo "TINT_API_BASE_URL=[${TINT_API_BASE_URL}]"
          if [ -z "$TINT_API_BASE_URL" ]; then
            echo "‼️ المتغيّر فارغ — سيُبنى تطبيقٌ بلا خادم. راجع مجموعة tint."
          else
            echo "فحص الوصول من جهاز البناء:"
            curl -s -o /dev/null -w "  HTTP %{http_code} · %{time_total}s" --max-time 25 "${TINT_API_BASE_URL}/health" || echo "  ‼️ تعذّر الوصول من الماك نفسه"
            echo ""
          fi
      - name: Build for simulator (no signing)
        script: |
          # ‼️ **متغيّرٌ فارغ لا يُمرَّر — وإلّا كان أسوأ من عدمه.**
          #
          #    `--dart-define=K=` يُعرِّف المفتاح بقيمةٍ فارغة، فترى
          #    `String.fromEnvironment` مفتاحاً **مُعرَّفاً** وتُرجع الفراغ
          #    **بدل الافتراضيّ المكتوب في الشيفرة**. والنتيجة تطبيقٌ بلا
          #    خادم يُقلع بأرففٍ فارغة — وهو ما ظهر في لقطات المعاينة
          #    (رُصد 2026-08-13) ويبدو كأنّه عطلُ شبكةٍ أو تصميم.
          BASE="${TINT_API_BASE_URL:-https://tint-production-4d38.up.railway.app/api}"
          echo "قاعدة الـAPI المستعملة: $BASE"
          flutter build ios --simulator --debug --no-codesign \
            --dart-define=TINT_API_BASE_URL=$BASE \
            --dart-define=TINT_TABBY_PUBLIC_KEY=$TINT_TABBY_PUBLIC_KEY \
            --dart-define=TINT_TABBY_MERCHANT_CODE=$TINT_TABBY_MERCHANT_CODE \
            --dart-define=TINT_TABBY_LANG=ar
      - name: Boot simulator, install, launch and capture
        script: |
          set -e
          # ‼️ سطرٌ واحد يستخرج UDID مباشرةً. المحاولة الأولى كانت تبحث بالاسم
          #    ثمّ تُطابقه ثانيةً — وأيّ فرقٍ في المسافات يُنتج UDID فارغاً.
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "المحاكي: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/ios/iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          # ‼️ **المعرّف يُقرأ من الحزمة المبنيّة لا يُكتب بالحرف.** كتابته
          #    يدويّاً هي ما أسقط المحاولة الأولى: السكربت أطلق
          #    `com.tintstore.app` بينما البناء أنتج `com.tintstore.tintMobile`.
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "الحزمة: $APP · المعرّف: $BUNDLE_ID"
          xcrun simctl install "$UDID" "$APP"
          # ‼️ **تُفتح واجهة المحاكي قبل الالتقاط.** `simctl boot` وحده يُقلعه
          #    بلا واجهة، و`simctl io … screenshot` على جهازٍ بلا واجهة يفشل
          #    صامتاً — وهو ما أنتج أرشيفاً بلا صورةٍ واحدة في المحاولة السابقة.
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          sleep 15
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          mkdir -p screenshots
          # ‼️ **مسارٌ مطلق — وهو ما أسقط ثلاث محاولات.**
          #
          # `simctl io … screenshot` يكتب الصورة عبر عمليّة المحاكي لا عبر هذه
          # الصدفة، ومجلّدها الحاليّ مختلف. فالمسار النسبيّ يُحَلّ في مكانٍ آخر،
          # ويخرج خطأٌ مُضلّل: «The folder "home-6s.png" doesn't exist» — يوحي
          # بأنّ المجلّد ناقص بينما هو موجود، والعطل في تفسير المسار لا فيه.
          SHOTS="$PWD/screenshots"
          # ‼️ انتظارٌ متدرّج لا لقطةٌ واحدة: الإقلاع يجلب الكتالوج والتخطيط من
          #    الشبكة، ولقطةٌ بعد ثانيتين تُظهر شاشةً فارغة وتُقرأ عطلاً.
          #
          # ‼️ **ولا `|| true` صامتة**: إخفاء الفشل هو ما جعل البناء يُعلن النجاح
          #    وهو لم يلتقط شيئاً. الخطأ يُكتب في ملفّ يخرج مع الأرشيف.
          for s in 6 12 20 30; do
            sleep 6
            xcrun simctl io booted screenshot "$SHOTS/home-${s}s.png" \
              2>> "$SHOTS/capture-errors.log" || echo "فشل الالتقاط عند ${s}s" >> "$SHOTS/capture-errors.log"
          done
          ls -l "$SHOTS" || true
          # ‼️ المرشّح بالمعرّف لا بكلمة «Runner»: `CONTAINS "Runner"` التقط
          #    `BackgroundShortcutRunner` — عمليّة نظامٍ — فخرج سجلٌّ بـ١٦٢١ سطراً
          #    لا سطر واحد منها عن التطبيق.
          xcrun simctl spawn "$UDID" log show --last 3m \
            --predicate "processImagePath ENDSWITH \"/Runner\"" \
            > "$SHOTS/device.log" 2>&1 || true
          # ‼️ فيديو الجلسة أنفع من أربع لقطات حين يُشتبه في تعليقٍ أو وميض.
          xcrun simctl io booted recordVideo --codec h264 "$SHOTS/session.mp4" &
          REC=$!
          sleep 10
          kill "$REC" 2>/dev/null || true
          sleep 2
      # ‼️ **حجز الجهاز لجلسة VNC تفاعليّة — مُطفأٌ افتراضيّاً.**
      #
      # بلا هذا يُدمَّر الماك بعد ثانيتين من الالتقاط، فلا يبقى وقتٌ للمس
      # المحاكي. ومع ذلك لا يُشغَّل تلقائيّاً: نصف ساعةٍ من دقائق البناء تُهدر
      # في كلّ بناءٍ آليّ لا أحد ينظر إليه.
      #
      # للتفعيل: اضبط `HOLD_FOR_VNC=true` في مجموعة `tint`، وأطفئها بعدها.
      - name: Hold machine for interactive VNC session
        script: |
          if [ "${HOLD_FOR_VNC:-false}" = "true" ]; then
            echo "الجهاز محجوزٌ ٣٠ دقيقة — اتّصل بـVNC الآن وافتح المحاكي."
            sleep 1800
          else
            echo "لا حجز (HOLD_FOR_VNC غير مضبوطة). للجلسة التفاعليّة اضبطها true."
          fi
    artifacts:
      - screenshots/*.png
      - screenshots/*.mp4
      - screenshots/*.log
      - build/ios/iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - asd.ss1993nawaf@gmail.com
        notify:
          success: true
          failure: true
