plugins {
    id "com.android.application"
    id "kotlin-android"
    // يجب أن يأتي بعد إضافتي Android و Kotlin
    id "dev.flutter.flutter-gradle-plugin"
    // ‼️ بعد إضافة أندرويد لا قبلها — وإلّا لا تجد إعدادات التطبيق.
    id "com.google.gms.google-services"
}

/**
 * مفتاح خرائط جوجل — **لا يدخل المستودع أبداً**.
 *
 * ‼️ يُقرأ من `android/maps.properties` (غير مُتعقَّب) أو من متغيّر البيئة
 *    `TINT_MAPS_ANDROID_KEY` (لبناء Codemagic). وقيمةٌ فارغة تُنتج خريطةً
 *    رماديّة — لا انهياراً — ولذلك يبقى مسار الخرائط المجّانيّة قائماً خلف
 *    عَلَم البناء `TINT_GOOGLE_MAPS`.
 *
 * ‼️ **وهذا المفتاح ليس سرّاً بمعنى مفتاح الدفع**: هو مُقيَّدٌ باسم الحزمة
 *    وبصمة التوقيع، فاستخراجه من الحزمة لا يُتيح استعماله في تطبيقٍ آخر.
 *    ومع ذلك **يجب أن يبقى مقيَّداً** — مفتاحٌ بلا قيود يُستنزف على حساب
 *    غيرك. ولا يُعاد استعمال مفتاح الخادم (ترميز العناوين) هنا: قيودهما
 *    متعارضة، وتوحيدهما يُلغي حماية أحدهما.
 */
def mapsKey = System.getenv("TINT_MAPS_ANDROID_KEY") ?: ""
def mapsPropertiesFile = rootProject.file("maps.properties")
if (mapsKey.isEmpty() && mapsPropertiesFile.exists()) {
    def mapsProperties = new Properties()
    mapsProperties.load(new FileInputStream(mapsPropertiesFile))
    mapsKey = mapsProperties.getProperty("MAPS_API_KEY") ?: ""
}

// تحميل إعدادات التوقيع من key.properties إن وُجد
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.tintstore.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // ‼️ تشترطها flutter_local_notifications: تُترجم واجهات جافا الحديثة
        //    (java.time) لتعمل على أندرويد الأقدم. وبدونها يسقط البناء نفسه.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.tintstore.app"
        // flutter_secure_storage 10 و Tabby SDK يتطلبان 23 على الأقل
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
        manifestPlaceholders["MAPS_API_KEY"] = mapsKey
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // يوقّع بمفتاح الإصدار إن وُجد key.properties، وإلا يستخدم مفتاح debug للتجربة
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // تعطيل تقليص R8 مؤقّتاً: أحد SDKات المكتبات ينقصه keep-rules فيفشل R8.
            // APK أكبر قليلاً لكنّه يُبنى ويعمل للتوزيع/التجربة. يُعاد تفعيله لاحقاً بقواعد keep صحيحة.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // ‼️ مكتبة التحويل نفسها — يلزم إعلانها صراحةً مع الخيار أعلاه.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
