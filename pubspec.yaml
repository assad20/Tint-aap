name: tint_mobile
description: Tint Store Flutter mobile app connected only to the Node.js middleware.
publish_to: "none"
version: 1.2.7+11

environment:
  # نطاق موسّع ليعمل على Flutter القديم (FlutLab = Dart 3.8.1) والجديد معاً
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ترجمات Material/Cupertino الرسميّة — يلزمها كلّ ودجت يطلب نصوصاً مترجمة،
  # وأوّلها منتقي التاريخ. بدونها تتجمّد تلك الشاشات رماديّةً بلا رسالة.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_bloc: ">=8.1.6 <10.0.0"
  go_router: ">=14.0.0 <18.0.0"
  shared_preferences: ^2.3.0
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  tabby_flutter_inapp_sdk: ^1.11.0
  # آبل باي الأصليّة — شريحة النظام وتوكنها، بلا مفاتيح مزوّدٍ على الجهاز.
  # ‼️ والدفع نفسه يقع في خادمنا (`/payments/paytabs/applepay/pay`): الحزمة
  #    تعرض الشريحة وتُسلّم التوكن، ولا تعرف عن PayTabs شيئاً.
  pay: ^3.3.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  cached_network_image: ^3.4.0 # تخزين صور دائم على القرص + ظهور سلس
  flutter_map: ^7.0.2 # خريطة OpenStreetMap تفاعليّة (بلا مفتاح/بطاقة)
  latlong2: ^0.9.1 # إحداثيّات LatLng لـflutter_map
  google_maps_flutter: ^2.9.0 # خرائط جوجل — نفس ما يراه العميل في نون
  webview_flutter: ^4.10.0 # نافذة نون بيمنت المستضافة داخل التطبيق
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  http: ^1.6.0
  flutter_svg: ^2.3.0
  firebase_analytics: ^12.4.6
  # مشغّل مقاطع المنتجات (شريط الفيديو). الرسميّ من فريق Flutter: يبني على
  # ExoPlayer في أندرويد وAVPlayer في iOS — فلا يُضيف محرّكاً ثالثاً للحزمة.
  video_player: ^2.9.2
  # ورقة المشاركة الأصليّة — واتساب وغيره من نفس الزرّ بلا تكامل لكلّ تطبيق.
  share_plus: ^13.3.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ">=0.13.1 <0.15.0"
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    # شعارات وسائل الدفع — نفس ملفّات الموقع (public/payment) لا نسخةً ثانية:
    # نسختان تتباعدان، وشروط أصحاب العلامات تسري على الاثنتين.
    - assets/payment/
  # خطّ عربيّ حقيقيّ بدل خطّ النظام — مُحزَّم في التطبيق فيعمل بلا إنترنت.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

# أيقونة التطبيق — شغّل بعد توليد المنصات:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  # ‼️ فحميّ لا أسود: القرص نفسه فحميّ، فخلفيّةٌ أدكن منه تُظهر حلقةً
  #    داكنة حول الإطار الذهبيّ عند القصّ.
  adaptive_icon_background: "#353B43"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# شاشة البداية — شغّل بعد توليد المنصات:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#111113"
  image: "assets/splash/splash_logo.png"
  android_12:
    color: "#111113"
    image: "assets/splash/splash_logo.png"
  ios: true
  android: true
